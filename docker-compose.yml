services:
  postgres:
    image: postgres:15-alpine
    container_name: moltmoney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moltmoney
      POSTGRES_PASSWORD: moltmoney_dev_password
      POSTGRES_DB: moltmoney
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moltmoney']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
